services:
  web:
    build: .
    ports: ["8088:80"]
    volumes: ["./:/var/www/html"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: acquavale_vendas
      DB_USERNAME: acquavale
      DB_PASSWORD: acquavale_local_change_me
      APP_URL: http://localhost:8088
      APP_ENV: local
      APP_DEBUG: "true"
      ADMIN_EMAIL: admin@acquavale.local
      ADMIN_PASSWORD: change-me-now
      API_KEY: dev-api-key-change-before-production
      SESSION_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: acquavale_vendas
      MYSQL_USER: acquavale
      MYSQL_PASSWORD: acquavale_local_change_me
      MYSQL_ROOT_PASSWORD: root_local_change_me
    volumes:
      - acquavale_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_local_change_me"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  acquavale_mysql:
